<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/paw-black.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MeowFeed — лента фотографий котиков и избранное. Данные из TheCatAPI" />
    <meta name="theme-color" content="#fdf6ec" />
    <title>MeowFeed — cats every day</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cat-theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) {
            icon.href = theme === 'dark' ? '/paw-white.svg' : '/paw-black.svg';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
